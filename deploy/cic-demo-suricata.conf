# CIC-IDS2017 demo only (docs/cic-demo.md). Installed as
#   /etc/systemd/system/suricata.service.d/zz-cic-demo.conf
# (sorts after override.conf, so this ExecStart wins). Same command as deploy/override.conf plus
# -i cic0, the dummy replay interface. Remove it after the demo: Suricata needs cic0 to exist.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml -i wlan0 -i eth0 -i cic0 --pidfile /run/suricata.pid
